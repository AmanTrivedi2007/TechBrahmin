<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">TechBrahmin</title>
  <style>
    /* Palette from the TechBrahmin website: ink + cream, with the rust accent as the tilak */
    :root { --badge: #222B33; --mark: #F7F4EE; --tilak: #D4673F; }
    @media (prefers-color-scheme: dark) { :root { --badge: #F3EFE8; --mark: #1B1F22; --tilak: #B8512F; } }
    .badge { fill: var(--badge); }
    .mark  { fill: var(--mark); }
    .tilak { fill: var(--tilak); }
    .line  { fill: none; stroke: var(--mark); stroke-width: 30; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Circle only, transparent outside -->
  <circle class="badge" cx="256" cy="256" r="248"/>

  <g transform="translate(0,25)">
    <!-- Tilak: elongated vertical mark -->
    <rect class="tilak" x="234" y="70" width="44" height="76" rx="22"/>

    <!-- Bold T: Tech -->
    <rect class="mark" x="146" y="170" width="220" height="54" rx="27"/>
    <rect class="mark" x="229" y="170" width="54" height="222" rx="27"/>

    <!-- Code brackets around the stem: software engineering -->
    <polyline class="line" points="190,272 150,314 190,356"/>
    <polyline class="line" points="322,272 362,314 322,356"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
